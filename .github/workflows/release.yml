name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests and desktop JAR
        run: ./gradlew :gamecore:check :composeApp:desktopJar --no-daemon --console=plain

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          .\gradlew.bat :composeApp:packageReleaseMsi --no-daemon "-PlauncherVersion=$version" "-PupdateRepository=$env:GITHUB_REPOSITORY"
          New-Item -ItemType Directory -Force release | Out-Null
          $package = Get-ChildItem composeApp/build/compose/binaries/main-release/msi -Filter *.msi | Select-Object -First 1
          if (-not $package) { throw 'MSI package was not produced' }
          Copy-Item $package.FullName "release/CactusLauncher-$version-windows-x64.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*
          if-no-files-found: error

  linux:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build DEB
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./gradlew :composeApp:packageReleaseDeb --no-daemon "-PlauncherVersion=$version" "-PupdateRepository=$GITHUB_REPOSITORY"
          mkdir -p release
          package=$(find composeApp/build/compose/binaries/main-release/deb -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          cp "$package" "release/CactusLauncher-$version-linux-x64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: release/*
          if-no-files-found: error

  macos:
    needs: check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Apple Silicon DMG
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./gradlew :composeApp:packageReleaseDmg --no-daemon "-PlauncherVersion=$version" "-PupdateRepository=$GITHUB_REPOSITORY"
          mkdir -p release
          package=$(find composeApp/build/compose/binaries/main-release/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$package"
          cp "$package" "release/CactusLauncher-$version-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: release/*
          if-no-files-found: error

  publish:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: '*-installer'
          merge-multiple: true
      - name: Create checksums and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum CactusLauncher-* > SHA256SUMS.txt
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" CactusLauncher-* SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cactus Launcher $version (бета)" \
            --generate-notes
